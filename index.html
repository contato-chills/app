<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chills Game — baixe grátis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0708;
    --ember:#FF6A00;
    --ember-hi:#FFA23A;
    --paper:#FFFFFF;
    --muted:#9A9296;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--ink);
    color:#fff;
    min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    padding:32px 24px;
    text-align:center;
    overflow-x:hidden;
  }
  /* brasa ambiente atras do logo */
  body::before{
    content:"";
    position:fixed;
    top:-10%;left:50%;
    width:min(720px,140vw);height:min(720px,140vw);
    transform:translateX(-50%);
    background:radial-gradient(circle,rgba(255,106,0,.28) 0%,rgba(255,106,0,.10) 38%,transparent 68%);
    pointer-events:none;
  }
  .card{position:relative;max-width:400px;width:100%}

  .logo{
    width:132px;height:132px;
    margin:0 auto 22px;
    border-radius:30px;
    display:block;object-fit:cover;
    box-shadow:0 18px 60px rgba(255,106,0,.35), 0 0 0 1px rgba(255,255,255,.08);
  }

  h1{
    font-family:'Bricolage Grotesque','Inter',sans-serif;
    font-size:clamp(34px,10vw,44px);
    font-weight:800;
    letter-spacing:-.02em;
    line-height:1;
    margin-bottom:12px;
  }
  .sub{
    color:var(--muted);
    font-size:15px;line-height:1.55;
    max-width:300px;margin:0 auto 10px;
  }
  .free{
    font-family:'Bricolage Grotesque','Inter',sans-serif;
    font-size:13px;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;
    color:var(--ember-hi);
    margin:0 0 26px;
  }

  /* Botoes: os dois com o mesmo peso, para nenhum parecer indisponivel */
  .stores{display:flex;flex-direction:column;gap:12px}
  .btn{
    display:flex;align-items:center;justify-content:center;gap:12px;
    width:100%;padding:14px 18px;
    border-radius:18px;
    background:var(--paper);
    color:#0B0708;
    text-decoration:none;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
    transition:transform .16s ease, box-shadow .16s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 16px 38px rgba(0,0,0,.55)}
  .btn:active{transform:translateY(0) scale(.985)}
  .btn:focus-visible{outline:3px solid var(--ember-hi);outline-offset:3px}
  .btn svg{width:26px;height:26px;flex:none}
  .btn .label{text-align:left;line-height:1.15}
  .btn .label small{
    display:block;
    font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    color:#6B6469;
  }
  .btn .label strong{
    font-family:'Bricolage Grotesque','Inter',sans-serif;
    font-size:18px;font-weight:700;letter-spacing:-.01em;
  }

  .tag{
    font-family:'Bricolage Grotesque','Inter',sans-serif;
    font-size:11px;font-weight:700;letter-spacing:.22em;
    color:#5E565A;
    margin-top:26px;
  }

  @media (prefers-reduced-motion: reduce){
    .btn{transition:none}
  }
</style>
</head>
<body>
  <main class="card">
    <img class="logo" src="logo.png" alt="Chills Game">
    <h1>Chills Game</h1>
    <p class="sub">Os melhores jogos para animar o seu rolê.</p>
    <p class="free">Baixe grátis</p>

    <div class="stores">
      <a class="btn" href="https://play.google.com/store/apps/details?id=com.twodevs.chills">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <path fill="#00D2FF" d="M47 22c-6 6-9 15-9 27v414c0 12 3 21 9 27l2 2 232-232v-8L49 20l-2 2z"/>
          <path fill="#FFCE00" d="M357 341l-77-77v-8l77-77 2 1 92 52c26 15 26 39 0 54l-92 52-2 3z"/>
          <path fill="#FF3A44" d="M359 340l-79-79L47 494c9 9 23 10 39 1l273-155"/>
          <path fill="#00E676" d="M359 172L86 17C70 8 56 9 47 18l233 233 79-79z"/>
        </svg>
        <span class="label">
          <small>Disponível no</small>
          <strong>Google Play</strong>
        </span>
      </a>

      <a class="btn" id="appleBtn" href="https://apps.apple.com/app/id6767399134">
        <svg viewBox="0 0 384 512" aria-hidden="true">
          <path fill="#0B0708" d="M318.7 268c-.5-58 47.4-85.9 49.5-87.2-27-39.4-69-44.8-83.9-45.4-35.7-3.6-69.7 21-87.8 21-18.1 0-46-20.5-75.6-19.9-38.9.6-74.8 22.6-94.8 57.4-40.4 70-10.3 173.5 29 230.3 19.2 27.8 42.1 59 72.1 57.9 28.9-1.2 39.8-18.7 74.8-18.7s44.8 18.7 75.4 18.1c31.1-.6 50.8-28.3 69.8-56.2 22-32 31-63 31.5-64.6-.7-.3-60.4-23.2-61-92.7zM261.5 84.6C277.3 65.5 288 39.1 285.1 12.7c-22.6.9-50 15.1-66.3 34-14.6 16.8-27.4 43.6-24 69.3 25.2 2 50.9-12.8 66.7-31.4z"/>
        </svg>
        <span class="label">
          <small>Baixe na</small>
          <strong>App Store</strong>
        </span>
      </a>
    </div>

    <div class="tag">BY TWO DEVS</div>
  </main>
</body>
</html>
